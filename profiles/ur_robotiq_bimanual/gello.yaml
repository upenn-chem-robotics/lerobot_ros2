arms:
  left:
    action_topic: /left_arm_controller/commands
    state_topic: /left_state_broadcaster/joint_states
  right:
    action_topic: /right_arm_controller/commands
    state_topic: /right_state_broadcaster/joint_states
services:
  control_mode:
    - /left_gello_offset_node/set_parameters
    - /right_gello_offset_node/set_parameters
  transition_ready:
    - /left_gello_offset_node/wait_for_mode_transition
    - /right_gello_offset_node/wait_for_mode_transition
rotation_arm: right
subtask_arms: []
use_reset_client: false
wrap_joints:
  - wrist_3_joint
unwrap:
  max_step: 1.5708
  waypoint_stamp_s: 1.0
recording:
  hz: 10
  stabilize_orientation_180: true
  orientation_mae_delta_threshold: 20.0
visualization:
  camera_grid_columns: 2
camera_defaults:
  settings:
    auto_exposure: 1
    white_balance_automatic: 0
    focus_automatic_continuous: 0
    zoom_absolute: 0
    exposure_time_absolute: 100
    white_balance_temperature: 4000
    power_line_frequency: 1
    gain: 1
    brightness: 50
    contrast: 50
    saturation: 50
    sharpness: 50
    hue: 50
    pan_absolute: 0
    tilt_absolute: 0
    pan_speed: 0
    tilt_speed: 0
left_cameras:
  left_wrist_top:
    port: /dev/v4l/by-id/REPLACE_LEFT_WRIST_CAMERA
    settings:
      focus_automatic_continuous: 0
      zoom_absolute: 0
      focus_absolute: 100
right_cameras:
  right_wrist_top:
    port: /dev/v4l/by-id/REPLACE_RIGHT_WRIST_CAMERA
    settings:
      focus_automatic_continuous: 0
      zoom_absolute: 0
      focus_absolute: 100
other_cameras:
  front:
    port: /dev/v4l/by-id/REPLACE_FRONT_CAMERA
    settings:
      focus_automatic_continuous: 0
      zoom_absolute: 0
      focus_absolute: 20
