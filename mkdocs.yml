site_name: lerobot-ros2
site_description: Documentation for the independent lerobot-ros2 interoperability project.
site_url: https://upenn-chem-robotics.github.io/lerobot_ros2/
repo_name: upenn-chem-robotics/lerobot_ros2
repo_url: https://github.com/upenn-chem-robotics/lerobot_ros2

plugins:
  - search
  - macros

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

extra:
  docs_version: !ENV [DOCS_VERSION, devel]
  repository_ref: !ENV [DOCS_REPOSITORY_REF, devel]
  image_tag: !ENV [DOCS_IMAGE_TAG, latest]
  version:
    provider: mike
    default: latest
    alias: true

nav:
  - Start here:
      - Overview: index.md
      - Concepts for first-time users: concepts.md
      - Installation: installation.md
      - Visualize your first dataset: first-run.md
  - Use the project:
      - Choose and run a workflow: workflows.md
      - Robot integration: robot-integration.md
      - Hardware and safety: hardware-and-safety.md
      - Configuration reference: configuration.md
  - Contribute and release:
      - Development: development.md

strict: true
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; lerobot-ros2 contributors
