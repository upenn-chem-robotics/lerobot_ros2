# Minimal generic template. For the supported lab setup, copy the profile under
# profiles/ur_robotiq_bimanual/ instead of editing this file.
# Replace every REPLACE_* value before use.
arms:
  left:
    action_topic: /REPLACE_LEFT_ARM_CONTROLLER/commands
    state_topic: /REPLACE_LEFT_STATE_BROADCASTER/joint_states
    gripper_joint: REPLACE_LEFT_GRIPPER_JOINT
  right:
    action_topic: /REPLACE_RIGHT_ARM_CONTROLLER/commands
    state_topic: /REPLACE_RIGHT_STATE_BROADCASTER/joint_states
    gripper_joint: REPLACE_RIGHT_GRIPPER_JOINT

services:
  control_mode:
    - /REPLACE_LEFT_GELLO_OFFSET_NODE/set_parameters
    - /REPLACE_RIGHT_GELLO_OFFSET_NODE/set_parameters
  transition_ready:
    - /REPLACE_LEFT_GELLO_OFFSET_NODE/wait_for_mode_transition
    - /REPLACE_RIGHT_GELLO_OFFSET_NODE/wait_for_mode_transition

# Disable UR-specific wrist wrapping unless this integration explicitly needs it.
# The supported UR profile enables its required wrap joint itself.
wrap_joints: []

recording:
  hz: 10

left_cameras:
  left_wrist:
    port: /dev/v4l/by-id/REPLACE_LEFT_WRIST_CAMERA

right_cameras:
  right_wrist:
    port: /dev/v4l/by-id/REPLACE_RIGHT_WRIST_CAMERA

other_cameras:
  front:
    port: /dev/v4l/by-id/REPLACE_FRONT_CAMERA
