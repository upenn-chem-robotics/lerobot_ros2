    repo: lerobot-data-smrithi-dose_solid
  - local: data/smrithi/funnel_insert_reactor         # ~6.2G
    repo: lerobot-data-smrithi-funnel_insert_reactor
  - local: data/smrithi/liquid_pouring                # ~104G
