[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-ros2"
version = "0.1.0"
description = "Recording, deploy, export and visualization utilities for UR3e bimanual teleoperation on top of huggingface/lerobot."
requires-python = ">=3.10"
readme = "README.md"
# ``lerobot`` (huggingface/lerobot) is deliberately NOT declared here: it is
# installed separately (editable, from a pinned commit) in the Docker image
# and we don't want pip to pull a PyPI version over the top of it.
#
# ``torch``/``torchvision`` are base, not an extra: we import them directly in
# 10 modules, and ``lerobot`` hard-requires torch>=2.7 anyway, so there is no
# install in which they are genuinely absent.
#
# ``gradio``/``matplotlib`` (viz) and ``evdev`` (pedal) ARE genuinely optional --
# only the visualizers and the foot pedal need them. See README "Install".
dependencies = [
    "numpy",
    "opencv-python",
    "pyyaml",
    "pillow",
    "pandas",
    "av",
    "pyarrow",
    "huggingface_hub>=0.26",
    "torch",
    "torchvision",
]

[project.optional-dependencies]
viz = ["gradio", "matplotlib"]
pedal = ["evdev"]
all = ["lerobot-ros2[viz,pedal]"]
# Pinned so a ruff release cannot turn a green checkout red on its own.
dev = ["ruff==0.16.1", "pytest"]

[project.scripts]
lerobot-ros-record = "lerobot_ros2.cli.record:main"
lerobot-ros-deploy = "lerobot_ros2.cli.deploy:main"
lerobot-ros-dagger = "lerobot_ros2.cli.dagger:main"
lerobot-ros-export = "lerobot_ros2.cli.export:main"
lerobot-ros-probe-cameras = "lerobot_ros2.cli.probe_cameras:main"
lerobot-ros-downsample = "lerobot_ros2.cli.downsample:main"
lerobot-ros-canonicalize = "lerobot_ros2.cli.canonicalize:main"
lerobot-ros-reorient = "lerobot_ros2.cli.reorient:main"
lerobot-ros-app = "lerobot_ros2.cli.app:main"
lerobot-ros-train-dagger = "lerobot_ros2.cli.train_dagger:main"
lerobot-ros-train = "lerobot_ros2.cli.train:main"
lerobot-ros-backup = "lerobot_ros2.cli.backup:main"
lerobot-ros-preview-aug = "lerobot_ros2.cli.preview_aug:main"
lerobot-ros-preview-episode = "lerobot_ros2.cli.preview_episode:main"
lerobot-ros-add-action-source = "lerobot_ros2.cli.add_action_source_to_base:main"
lerobot-ros-add-action-source-with-plateau = "lerobot_ros2.cli.add_action_source_with_plateau:main"
lerobot-ros-plateau-stats = "lerobot_ros2.cli.plateau_stats:main"
lerobot-ros-plateau-visualize = "lerobot_ros2.cli.plateau_visualize:main"
lerobot-ros-trim-tail = "lerobot_ros2.cli.trim_tail:main"
lerobot-ros-cut = "lerobot_ros2.cli.cut:main"
lerobot-ros-fix-subtasks = "lerobot_ros2.cli.fix_subtasks:main"
lerobot-ros-renumber-episodes = "lerobot_ros2.cli.renumber_episodes:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.egg-info"]

[tool.ruff.lint]
# Deliberately narrow: the default rules (pyflakes + the pycodestyle subset that
# catches real bugs) plus import sorting. This is the set the codebase already
# passes, so a lint failure in CI means something new is actually wrong rather
# than a pre-existing style debt resurfacing. Widen it when you are willing to
# fix the backlog it uncovers.
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    # Several CLIs must set OPENCV_LOG_LEVEL / OPENCV font paths, or probe for
    # optional ROS and LeRobot plugin modules, before the corresponding import
    # runs. That ordering is load-bearing, so imports genuinely cannot all sit
    # at the top of the file.
    "E402",
]

[tool.ruff.lint.isort]
# The two policy plugins under packages/ are separate distributions but they are
# this repo's code, so group them with lerobot_ros2 rather than with upstream
# lerobot.
known-first-party = [
    "lerobot_ros2",
    "lerobot_policy_strided_diffusion",
    "lerobot_policy_action_history_diffusion",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The hardware-facing CLIs need ROS 2 and a real robot; the suite here covers
# the pure-logic pieces that run anywhere.
addopts = "-ra"
