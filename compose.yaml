name: lerobot-ros2
x-common: &common
  build:
    context: .
    target: runtime
  image: ${LEROBOT_ROS_IMAGE:-lerobot-ros2}:${IMAGE_TAG:-dev}
  user: "${LEROBOT_HOST_UID:-1000}:${LEROBOT_HOST_GID:-1000}"
  init: true
  environment:
    HOME: /tmp
    LEROBOT_HOST_UID: ${LEROBOT_HOST_UID:-1000}
    LEROBOT_HOST_GID: ${LEROBOT_HOST_GID:-1000}
    GELLO_CONFIG: /config/gello.yaml
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  volumes:
    - ${LEROBOT_DATA:-./data}:/data
    - ${LEROBOT_CONFIG:-./config.local}:/config:ro
    - ${LEROBOT_CACHE:-./.cache/lerobot}/huggingface:/cache/huggingface
    - ${LEROBOT_CACHE:-./.cache/lerobot}/torch:/cache/torch

services:
  tools:
    <<: *common
    ports:
      - "127.0.0.1:${LEROBOT_APP_PORT:-7860}:7860"
    command: ["lerobot-ros-doctor", "--skip-ros-graph", "--skip-hardware"]

  gpu:
    <<: *common
    gpus: all
    ipc: host

  robot:
    <<: *common
    network_mode: host
    ipc: host
    # Add stable /dev/v4l/by-id and /dev/input/by-id mappings in a local
    # compose override. Do not use privileged: true.

  dev:
    <<: *common
    build:
      context: .
      target: dev
    volumes:
      - .:/workspace
      - ${LEROBOT_DATA:-./data}:/data
      - ${LEROBOT_CONFIG:-./config.local}:/config:ro
      - ${LEROBOT_CACHE:-./.cache/lerobot}/huggingface:/cache/huggingface
      - ${LEROBOT_CACHE:-./.cache/lerobot}/torch:/cache/torch
    command: ["bash"]
