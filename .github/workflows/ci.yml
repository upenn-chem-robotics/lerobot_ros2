name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  IMAGE: lerobot-ros2-ci:${{ github.sha }}
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject tracked runtime data
        run: "! git ls-files | grep -E '^(data|outputs|config.local|third_party)/'"
      - name: Validate Compose
        run: docker compose config --quiet
  image:
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runtime smoke tests
        run: |
          mkdir -p ci-config ci-data
          cp examples/gello.yaml ci-config/gello.yaml
          docker run --rm -e GELLO_CONFIG=/config/gello.yaml -v "$PWD/ci-config:/config:ro" -v "$PWD/ci-data:/data" "$IMAGE" lerobot-ros-doctor --skip-hardware --skip-ros-graph
          docker run --rm "$IMAGE" python -m pip check
          docker run --rm "$IMAGE" ros2 doctor --report
      - name: Test development target
        run: |
          docker build --target dev -t "${IMAGE}-dev" .
          docker run --rm -v "$PWD:/workspace" -w /workspace "${IMAGE}-dev" pytest --ignore=tests/integration
          docker run --rm -e ROS_DOMAIN_ID=127 -e ROS_LOCALHOST_ONLY=1 -v "$PWD:/workspace" -w /workspace "${IMAGE}-dev" pytest -q tests/integration/test_ros_graph_smoke.py tests/integration/test_console_scripts.py
          docker run --rm -v "$PWD:/workspace" -w /workspace "${IMAGE}-dev" ruff check .
      - name: Scan image
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
