name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with LEROBOT_COMMIT in the Dockerfile.
  LEROBOT_COMMIT: d60a700d2b32590ed113d694fd87617e43506081

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Installed standalone rather than via the dev extra so linting does not
      # have to wait on torch.
      - run: pip install ruff==0.16.1
      - run: ruff check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      # CPU wheels only: CI has no GPU and the CUDA builds are several GB.
      - name: Install torch (CPU)
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install lerobot at the pinned commit
        run: pip install "lerobot @ git+https://github.com/huggingface/lerobot.git@${LEROBOT_COMMIT}"

      # The policy plugins must stay separate distributions: lerobot discovers
      # third-party policies by scanning installed distributions named
      # lerobot_policy_*.
      - name: Install this package and the policy plugins
        run: |
          pip install -e ".[dev]"
          pip install -e packages/lerobot_policy_strided_diffusion
          pip install -e packages/lerobot_policy_action_history_diffusion

      # rclpy comes from the robostack conda channel and is not pip-installable,
      # so the ROS-facing code paths stay untested here; every module guards its
      # rclpy import, which this check also exercises.
      - name: Import every console-script module
        run: |
          python - <<'PY'
          import importlib
          from importlib.metadata import entry_points

          scripts = [
              ep for ep in entry_points(group="console_scripts")
              if ep.module.startswith("lerobot_ros2")
          ]
          if not scripts:
              raise SystemExit("no lerobot_ros2 console scripts found; is the package installed?")

          failed = []
          for ep in sorted(scripts, key=lambda e: e.name):
              try:
                  importlib.import_module(ep.module)
              except Exception as exc:
                  failed.append(f"{ep.name} ({ep.module}): {type(exc).__name__}: {exc}")

          for line in failed:
              print("FAIL", line)
          print(f"checked {len(scripts)} console scripts, {len(failed)} failed")
          raise SystemExit(1 if failed else 0)
          PY

      - run: pytest
